rules:
  - id: php-deser-unserialize-user
    pattern-either:
      - pattern: unserialize($_GET[...])
      - pattern: unserialize($_POST[...])
      - pattern: unserialize($_REQUEST[...])
      - pattern: unserialize($_COOKIE[...])
    message: "unserialize() on user input — insecure deserialization (RCE risk)"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: php-deser-yaml-parse
    pattern: yaml_parse(...)
    message: "yaml_parse() — verify input source; unsafe mode may allow object injection"
    languages: [php]
    severity: WARNING
    metadata:
      cwe: "CWE-502"
