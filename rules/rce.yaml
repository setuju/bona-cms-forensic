rules:
  - id: php-rce-eval
    pattern: eval(...)
    message: "eval() detected - potential RCE"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: "CWE-94: Code Injection"

  - id: php-rce-shell-exec-user-input
    patterns:
      - pattern: shell_exec(...)
      - pattern-not: shell_exec("...")
      - pattern-not: shell_exec('...')
      - pattern-not: shell_exec($var)
      - metavariable-pattern:
          metavariable: $arg
          patterns:
            - pattern: shell_exec($arg)
            - pattern-either:
                - pattern: $arg
    message: "shell_exec() dengan user input - potential RCE (review manual)"
    languages: [php]
    severity: WARNING
    metadata:
      cwe: "CWE-78: OS Command Injection"
