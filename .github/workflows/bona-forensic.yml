name: Bona Forensic Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: forensic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Run Bona Forensic Audit (CI Mode)
        run: php scripts/bona-forensic.php --ci || true
