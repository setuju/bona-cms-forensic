name: Bona Forensic Self-Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: forensic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, xml, mbstring, pdo_mysql, tokenizer, fileinfo
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Make bin/forensic executable
        run: chmod +x bin/forensic

      - name: Run Bona Forensic (CI mode)
        run: ./bin/forensic --root=. --ci --show-findings

      - name: Generate JSON report
        if: always()
        run: ./bin/forensic --root=. --json > forensic-report.json || true

      - name: Verify read-only guarantee
        if: always()
        run: ./bin/forensic --root=. --section=integrity

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-report-php${{ matrix.php }}
          path: |
            forensic-report.json
            .bona/logs/
            .bona/*.mmd
          retention-days: 14
          if-no-files-found: ignore
