#
# Why not CodeQL? Because CodeQL has NO first-party PHP support.
# PHPStan + SARIF gives the SAME experience in the "Security" tab.
# Reference: https://github.com/orgs/community/discussions/158392

name: "PHPStan (Code Scanning)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan Level 8
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # required to upload SARIF
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, xml, mbstring, pdo_mysql, tokenizer, fileinfo
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan (SARIF output)
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan.neon \
            --error-format=sarif \
            --no-progress \
            > phpstan-results.sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: phpstan-results.sarif
          category: phpstan
          wait-for-processing: true

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-sarif
          path: phpstan-results.sarif
          retention-days: 14
          if-no-files-found: ignore
