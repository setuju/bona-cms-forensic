rules:
  - id: php-open-redirect-header-user
    pattern-regex: 'header\s*\([^;]*Location[^;]*\$_(GET|POST|REQUEST|COOKIE)'
    message: "header(Location) with user input - open redirect risk"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: "CWE-601: URL Redirection to Untrusted Site"
      owasp: "A01:2021 - Broken Access Control"
  - id: php-open-redirect-wp-redirect
    pattern-either:
      - pattern: wp_redirect($_GET[...])
      - pattern: wp_redirect($_POST[...])
      - pattern: wp_redirect($_REQUEST[...])
    message: "wp_redirect() with user input — use wp_safe_redirect instead"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: "CWE-601"
